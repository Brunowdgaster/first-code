name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  curriculo:
    name: curriculo (Pascal, Logo, Scratch, Blockly, Smalltalk)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: compiladores e interpretadores
        run: |
          sudo apt-get update -qq
          # ucblogo precisa de xvfb: o pacote e build so grafico, e sem
          # display ele nao escreve nada em stdout -- nem --help -- e sai
          # com codigo 0. Ver o README.
          sudo apt-get install -y -qq fp-compiler ucblogo xvfb nodejs npm
          fpc -iV
          node --version

      - name: Pharo 11 (Smalltalk, MIT)
        run: |
          # O Pharo nao tem pacote no Ubuntu, e nenhum Smalltalk utilizavel
          # tem: gnu-smalltalk saiu do Debian, e squeak-vm + etoys instalam
          # mas a imagem do Etoys ignora o .st passado.
          #
          # A VERSAO E FIXA no caminho `110`, pelo mesmo argumento do nixpkgs
          # travado e do AutoHotkey 2.0.31 do p12: "stable" responde "o que
          # roda hoje", nao "com o que isso foi verificado".
          mkdir -p ~/pharo/vm ~/pharo/img
          cd ~/pharo
          curl -sS -L --retry 3 -o vm.zip             https://files.pharo.org/vm/pharo-spur64-headless/Linux-x86_64/stable.zip
          curl -sS -L --retry 3 -o img.zip             https://files.pharo.org/image/110/latest-64.zip
          unzip -q vm.zip -d vm
          unzip -q img.zip -d img
          # Falha ALTO se o binario ou a imagem nao apareceram. Sem isto, a
          # suite reportaria "Pharo ausente" como falha de TESTE, e a causa
          # real (download quebrado) ficaria escondida atras dela.
          test -x ~/pharo/vm/pharo || { echo 'vm/pharo nao foi extraido'; exit 1; }
          test -n "$(find ~/pharo/img -name '*.image' | head -1)"             || { echo 'nenhuma .image extraida'; exit 1; }
          ~/pharo/vm/pharo "$(find ~/pharo/img -name '*.image' | head -1)"             eval '6 * 7' </dev/null

      - name: a suite, em modo exigente
        # P14_EXIGE=1 transforma "pulado" em FALHA: no CI, dependencia
        # ausente e defeito do ambiente, nao resultado.
        env:
          P14_EXIGE: '1'
        run: ./verifica.sh

      - name: os artefatos gerados estao em dia
        # Os .sb3 e os XML de blocos sao COMMITADOS, porque sao o artefato
        # que alguem abre no editor. Se os geradores mudarem e os arquivos
        # nao forem regerados, o repositorio passa a mostrar uma coisa e
        # verificar outra.
        #
        # A geracao e deterministica de proposito (ZIP_STORED, carimbo de
        # tempo fixo), e e isso que torna este passo possivel.
        run: |
          python3 scratch/gera.py
          python3 blockly/monta_licoes.py
          git diff --exit-code -- scratch/ blockly/licoes/ \
            || { echo 'artefatos desatualizados: rode os geradores e commite'; exit 1; }
